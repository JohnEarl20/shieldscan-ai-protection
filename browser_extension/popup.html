<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>ShieldScan</title>
  <link rel="stylesheet" href="popup.css"/>
</head>
<body>

  <!-- HEADER -->
  <div class="popup-header">
    <div class="popup-logo">
      <div class="popup-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6l-8-4z" fill="#4f8ef7"/>
          <path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="popup-logo-name">ShieldScan</div>
        <div class="popup-logo-sub">AI Scam Protection</div>
      </div>
    </div>
    <div class="popup-api-badge" id="apiBadge">
      <span class="popup-api-dot" id="apiBadgeDot"></span>
      <span id="apiBadgeText">Connecting</span>
    </div>
  </div>

  <!-- STATUS BANNER -->
  <div class="popup-status-banner" id="statusBanner">
    <div class="popup-status-left">
      <div class="popup-shield-wrap">
        <div class="popup-shield-glow"></div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6l-8-4z"
                fill="rgba(45,206,137,0.3)" stroke="#2dce89" stroke-width="1.5"/>
          <path d="M9 12l2 2 4-4" stroke="#2dce89" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="popup-status-title" id="statusTitle">Protection Active</div>
        <div class="popup-status-sub" id="statusSub">ShieldScan is protecting you</div>
      </div>
    </div>
    <div class="popup-status-pill" id="statusPill">
      <span class="popup-status-dot"></span>
      Active
    </div>
  </div>

  <!-- STATS ROW -->
  <div class="popup-stats">
    <div class="popup-stat">
      <div class="popup-stat-val" id="threatsBlocked">—</div>
      <div class="popup-stat-lbl">Threats Blocked</div>
    </div>
    <div class="popup-stat-divider"></div>
    <div class="popup-stat">
      <div class="popup-stat-val" id="protectionScore">—</div>
      <div class="popup-stat-lbl">Protection Score</div>
    </div>
    <div class="popup-stat-divider"></div>
    <div class="popup-stat">
      <div class="popup-stat-val" id="scansToday">—</div>
      <div class="popup-stat-lbl">Scans Today</div>
    </div>
  </div>

  <!-- QUICK SCAN INPUT -->
  <div class="popup-scan-section">
    <div class="popup-scan-input-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <input id="scanInput" type="text" placeholder="Paste a link to scan…" class="popup-scan-input"/>
    </div>
    <button class="popup-btn-scan" id="scanLinkBtn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      Scan
    </button>
  </div>

  <!-- SCAN RESULT -->
  <div class="popup-scan-result hidden" id="scanResult"></div>

  <!-- ACTION BUTTONS -->
  <div class="popup-actions">
    <button class="popup-btn-primary" id="dashboardBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      Open Full Dashboard
    </button>

    <div class="popup-btn-row">
      <button class="popup-btn-secondary" id="quickScanBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        Quick Scan
      </button>
      <button class="popup-btn-secondary" id="scanPageBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        Scan Page
      </button>
    </div>

    <div class="popup-btn-row">
      <button class="popup-btn-secondary" id="vpnBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M2 12h20"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10A15.3 15.3 0 0 1 8 12a15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span id="vpnBtnText">VPN Off</span>
      </button>
      <button class="popup-btn-secondary" id="historyBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/>
        </svg>
        History
      </button>
    </div>
  </div>

  <!-- TRACKER PANEL -->
  <div class="popup-tracker-panel">
    <div class="popup-tracker-header" id="trackerToggle">
      <div class="popup-tracker-left">
        <div class="popup-tracker-icon">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <span class="popup-tracker-title">Trackers &amp; Ads Blocked</span>
      </div>
      <div class="popup-tracker-right">
        <span class="popup-tracker-badge" id="trackerBadge">0</span>
        <svg class="popup-tracker-chevron" id="trackerChevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
    </div>
    <div class="popup-tracker-body" id="trackerBody">
      <div class="popup-tracker-tabs">
        <button class="popup-tracker-tab active" id="tabThisPage">This Page</button>
        <button class="popup-tracker-tab" id="tabAllTime">All Time</button>
      </div>
      <div id="trackerList" class="popup-tracker-list">
        <div class="popup-tracker-empty">No trackers detected on this page</div>
      </div>
    </div>
  </div>

  <!-- RECENT DETECTIONS -->
  <div class="popup-recent">
    <div class="popup-recent-header">
      <span class="popup-section-title">Recent Detections</span>
      <button class="popup-view-all" id="viewAllBtn">View all</button>
    </div>
    <div id="recentList">
      <div class="popup-loading">Loading…</div>
    </div>
  </div>

  <!-- NOTIFICATION TOAST -->
  <div class="popup-toast hidden" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
